<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>MTA Suspended Service</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="dashboard" aria-live="polite">
      <header class="topbar">
        <div>
          <p class="eyebrow">MTA Service Monitor</p>
          <h1>Suspended Lines</h1>
        </div>
        <div class="updated" id="lastUpdated">Updated: --:--</div>
      </header>

      <section class="summary-panel" aria-label="Suspended service summary">
        <div class="count-block">
          <span id="suspendedCount">0</span>
          <p id="statusLabel">No Suspensions</p>
        </div>
        <div class="line-chip-panel">
          <h2>Subway Lines With Suspended Service</h2>
          <div class="line-chips" id="lineChips">
            <p class="clear-state">No suspended lines right now.</p>
          </div>
        </div>
      </section>

      <section class="alerts-panel" aria-label="Active alerts">
        <div class="panel-heading">
          <h2>Suspension Alerts</h2>
        </div>
        <div class="error-banner" id="errorBanner" hidden>⚠ Unable to retrieve MTA status</div>
        <div class="alerts-list" id="alertsList">
          <p class="empty-state">No active suspended service alerts.</p>
        </div>
      </section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
