<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>MTA Service Status</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="dashboard" aria-live="polite">
      <header class="topbar">
        <div>
          <p class="eyebrow">MTA Service Status</p>
          <h1>System Overview</h1>
        </div>
        <div class="updated" id="lastUpdated">Updated: --:--</div>
      </header>

      <section class="status-grid" aria-label="Overall service status">
        <article class="status-card good" data-service="subway">
          <div class="service-icon" aria-hidden="true">🚇</div>
          <div>
            <h2>Subway</h2>
            <p>Good Service</p>
          </div>
        </article>
        <article class="status-card good" data-service="bus">
          <div class="service-icon" aria-hidden="true">🚌</div>
          <div>
            <h2>Bus</h2>
            <p>Good Service</p>
          </div>
        </article>
        <article class="status-card good" data-service="lirr">
          <div class="service-icon" aria-hidden="true">🚆</div>
          <div>
            <h2>LIRR</h2>
            <p>Good Service</p>
          </div>
        </article>
        <article class="status-card good" data-service="metroNorth">
          <div class="service-icon" aria-hidden="true">🚆</div>
          <div>
            <h2>Metro-North</h2>
            <p>Good Service</p>
          </div>
        </article>
      </section>

      <section class="alerts-panel" aria-label="Active alerts">
        <div class="panel-heading">
          <h2>Active Alerts</h2>
          <span id="alertCount">0</span>
        </div>
        <div class="error-banner" id="errorBanner" hidden>⚠ Unable to retrieve MTA status</div>
        <div class="alerts-list" id="alertsList">
          <p class="empty-state">No active systemwide alerts.</p>
        </div>
      </section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
